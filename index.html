<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ava's List</title>
<style>
  :root{
    --paper:#F3EDE3; --card:#FBF8F2; --ink:#33302B; --muted:#8C857A;
    --clay:#C2705C; --clay-deep:#A2533F; --sage:#7E8D6A; --gold:#C99A3C; --plum:#7A5AA0;
    --line:#E7DDCD; --line-soft:#EFE8DB; --shadow:0 1px 2px rgba(60,48,36,.06),0 8px 24px rgba(60,48,36,.07);
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:0 0 120px}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:8px}

  header{padding:26px 0 12px}
  .toprow{display:flex;align-items:center;gap:10px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--clay-deep);font-weight:600}
  .status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .status .led{width:8px;height:8px;border-radius:50%;background:#C9BEA8}
  .status.ok .led{background:var(--sage)}
  .status.err .led{background:#C2705C}
  h1{font-family:"Iowan Old Style",Georgia,"Palatino",serif;font-size:34px;line-height:1.05;margin:8px 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0}
  .iconbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--clay-deep)}
  .iconbtn:hover{background:var(--line-soft)}

  .tabs{display:flex;background:var(--line-soft);border-radius:13px;padding:4px;margin:18px 0 6px;gap:2px}
  .tabs button{flex:1;border-radius:10px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
  .tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(60,48,36,.1)}

  .add{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:8px;margin:12px 0 16px}
  .add .row1{display:flex;gap:8px;align-items:center}
  .add input.name{flex:1;border:0;background:none;padding:12px 10px;font-size:16px}
  .add input.name::placeholder{color:#B7AE9F}
  .addbtn{background:var(--clay);color:#fff;border-radius:12px;padding:0 16px;height:42px;font-weight:600}
  .addbtn:hover{background:var(--clay-deep)}
  .details{display:none;gap:8px;flex-wrap:wrap;padding:8px 4px 4px}
  .details.open{display:flex}
  .details label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
  .details select,.details input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px}
  .details input[type=number]{width:110px}
  .giftpick{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);align-self:end;padding-bottom:8px}

  .filters{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;-webkit-overflow-scrolling:touch}
  .chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted)}
  .chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .catfilters{padding-top:0}
  .catfilters .chip[aria-pressed=true]{background:var(--clay);border-color:var(--clay)}

  .group{margin-bottom:22px}
  .group h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 4px 8px;font-weight:600}
  .item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
  .check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #CDBFA8;margin-top:1px;display:grid;place-items:center;transition:all .15s}
  .check:hover{border-color:var(--sage)}
  .item.done .check{background:var(--sage);border-color:var(--sage)}
  .check svg{opacity:0;transform:scale(.6);transition:all .15s}
  .item.done .check svg{opacity:1;transform:scale(1)}
  .body{flex:1;min-width:0}
  .iname{font-weight:600;word-break:break-word}
  .item.done .iname{text-decoration:line-through;color:var(--muted);text-decoration-color:#CDBFA8}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
  .tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line-soft);color:var(--muted)}
  .tag.price{color:var(--clay-deep);background:#F6E7E1;font-weight:600}
  .tag.gift{color:var(--plum);background:#EFE7F6}
  .tag.pri-must{color:var(--clay-deep);background:#F6E7E1}
  .tag.pri-someday{color:var(--muted)}
  .note{font-size:13px;color:var(--muted);margin-top:4px;white-space:pre-wrap}
  .answer{font-size:14px;color:var(--ink);margin-top:6px;white-space:pre-wrap;border-left:2px solid var(--sage);padding-left:10px}
  .rowbtns{display:flex;gap:2px;flex:none}
  .rowbtns button{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#B7AE9F}
  .rowbtns button:hover{background:var(--line-soft);color:var(--ink)}

  .summary{position:fixed;left:0;right:0;bottom:0;background:rgba(251,248,242,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 18px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
  .summary .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
  .summary b{font-family:"Iowan Old Style",Georgia,serif}
  .progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;flex:1;max-width:160px}
  .progress i{display:block;height:100%;background:var(--sage);width:0;transition:width .3s}

  .empty{text-align:center;color:var(--muted);padding:50px 20px}
  .empty h3{color:var(--ink);font-family:"Iowan Old Style",Georgia,serif;font-weight:500;margin:0 0 6px}

  .scrim{position:fixed;inset:0;background:rgba(51,48,43,.42);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .scrim.open{display:flex}
  .sheet{background:var(--paper);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 18px 26px;max-height:88vh;overflow:auto;box-shadow:0 -10px 40px rgba(51,48,43,.2)}
  .sheet h3{margin:2px 0 14px;font-family:"Iowan Old Style",Georgia,serif;font-size:22px;font-weight:500}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px}
  .field textarea{min-height:70px;resize:vertical}
  .cats{display:flex;flex-wrap:wrap;gap:8px}
  .cattag{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:14px}
  .cattag button{color:var(--muted);width:22px;height:22px;border-radius:50%}
  .cattag button:hover{background:var(--line-soft);color:var(--clay-deep)}
  .sheet-actions{display:flex;gap:10px;margin-top:8px}
  .btn{flex:1;border-radius:12px;padding:13px;font-weight:600;text-align:center}
  .btn.primary{background:var(--clay);color:#fff}
  .btn.primary:hover{background:var(--clay-deep)}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
  .notice{font-size:12px;color:var(--muted);background:var(--line-soft);border-radius:10px;padding:9px 11px;margin-top:8px;line-height:1.45}

  .errbar{display:none;background:#F6E2DD;border:1px solid #E3B7AC;color:#8A3B28;border-radius:12px;padding:11px 13px;margin:14px 0;font-size:13px;line-height:1.45}
  .errbar.show{display:block}
  .errbar code{background:rgba(138,59,40,.1);padding:1px 5px;border-radius:5px;font-size:12px;word-break:break-all}
  .toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
  const CONFIG = {
    SUPABASE_URL: "https://hvpzompdazaepaxmqqnb.supabase.co",
    SUPABASE_KEY: "sb_publishable_KF581RRUElZOoDuXqDl7gw_hzlUYJ5J",
    TABLE: "shared_lists",
    LIST_ID: "avas-main",      // both of you load the same hosted file, so you share this id
    POLL_SECONDS: 4
  };
</script>

<div class="wrap">
  <div class="errbar" id="errbar"></div>
  <header>
    <div class="toprow">
      <span class="eyebrow">Our shared list</span>
      <span class="status" id="status" title="Sync status"><span class="led"></span><span id="statusText">Connecting…</span></span>
      <button class="iconbtn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <h1 id="title">Ava's List</h1>
    <p class="sub" id="subtitle"></p>
    <div class="tabs" id="tabs" role="tablist">
      <button role="tab" data-v="items">Things to get</button>
      <button role="tab" data-v="todos">To do</button>

  <div class="add">

      <button class="iconbtn" id="toggleDetails" title="More options" aria-label="More options">

    <div class="details" id="details">

        <option value="must">Must-have</option><option value="nice" selected>Nice to have</option><option value="someday">Someday</option>

      <label class="giftpick"><input type="checkbox" id="newGift" /> It's a gift</label>
    </div>
  </div>

  <div class="filters" id="filters"></div>
  <div class="filters catfilters" id="catFilters"></div>
  <div id="list"></div>
</div>

<div class="summary"><div class="in">
  <span id="count">—</span>
  <div class="progress"><i id="bar"></i></div>

</div></div>

<!-- Settings -->
<div class="scrim" id="settingsScrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Settings">

    <div class="field"><label>Title</label><input id="setTitle" /></div>

<div class="toast" id="toast"></div>

<script>
let doc=null,lastRaw="",view="items",filter="all",catFilter="all",editingId=null;
const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now()+"-"+Math.random().toString(36).slice(2,6);

function blank(){return{v:3,title:"Ava's List",subtitle:"Everything we're getting ready, together",
  categories:["Essentials","Nursery","Clothing","Feeding","Health","Other"],
  items:[],todos:[],questions:[]};}
function migrate(d){d.todos=d.todos||[];d.questions=d.questions||[];d.items=d.items||[];d.categories=d.categories||blank().categories;d.v=3;return d;}

const VIEWS={
  items:{coll:"items",placeholder:"Add something to the list…",hasDetails:true,
    filters:[["all","Everything"],["open","To get"],["done","Got it"],["gift","Gifts"]],
    editHead:"Edit item",nameLabel:"Name",noteLabel:"Note",showItemFields:true},
  todos:{coll:"todos",placeholder:"Add a to-do… e.g. book antenatal classes",hasDetails:false,
    filters:[["all","All"],["open","To do"],["done","Done"]],
    editHead:"Edit to-do",nameLabel:"To-do",noteLabel:"Note (when, where, details)",showItemFields:false},
  questions:{coll:"questions",placeholder:"Add a question for the doctor…",hasDetails:false,
    filters:[["all","All"],["open","To ask"],["done","Answered"]],
    editHead:"Edit question",nameLabel:"Question",noteLabel:"Answer / notes",showItemFields:false}
};
const coll=()=>doc[VIEWS[view].coll];

/* ---------- Supabase REST layer ---------- */
const REST=`${CONFIG.SUPABASE_URL}/rest/v1/${CONFIG.TABLE}`;
const HEAD={apikey:CONFIG.SUPABASE_KEY,Authorization:"Bearer "+CONFIG.SUPABASE_KEY,"Content-Type":"application/json"};
function setStatus(state){const el=$("status");el.className="status "+(state==="ok"?"ok":state==="err"?"err":"");
  $("statusText").textContent=state==="ok"?"Synced":state==="err"?"Offline":"Connecting…";}
function showErr(where,status,detail){
  const b=$("errbar");
  let hint="";
  if(status===404||/PGRST205|does not exist|find the table/i.test(detail)) hint="The <code>shared_lists</code> table isn't there yet. Run the setup SQL in Supabase → SQL Editor.";
  else if(status===401||status===403||/permission|policy|RLS|JWT|api key/i.test(detail)) hint="Supabase rejected the request — usually the table's access policies weren't created, or the key is off. Re-run the SQL (the three policy lines), and check the key in Supabase → Settings → API.";
  else if(status===0) hint="Couldn't reach Supabase at all — check the project URL and your internet.";
  b.innerHTML=`<b>Can't save (${where}${status?`, HTTP ${status}`:""}).</b> ${hint}<br><span style="opacity:.8">Details: <code>${esc((detail||"no response").slice(0,300))}</code></span>`;
  b.classList.add("show");
}
function clearErr(){$("errbar").classList.remove("show");}

async function readRaw(){
  try{
    const r=await fetch(`${REST}?id=eq.${encodeURIComponent(CONFIG.LIST_ID)}&select=data`,{headers:HEAD});
    if(!r.ok){const t=await r.text();setStatus("err");showErr("reading",r.status,t);return undefined;}
    const rows=await r.json();
    setStatus("ok");clearErr();
    return rows.length?JSON.stringify(rows[0].data):null;
  }catch(e){setStatus("err");showErr("reading",0,String(e&&e.message||e));return undefined;}
}
async function writeDoc(d){
  d.updatedAt=Date.now();lastRaw=JSON.stringify(d);doc=d;
  try{
    const r=await fetch(`${REST}?on_conflict=id`,{method:"POST",
      headers:{...HEAD,Prefer:"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify([{id:CONFIG.LIST_ID,data:d,updated_at:new Date().toISOString()}])});
    if(!r.ok){const t=await r.text();setStatus("err");showErr("saving",r.status,t);return;}
    setStatus("ok");clearErr();
  }catch(e){setStatus("err");showErr("saving",0,String(e&&e.message||e));}
}
async function mutate(fn){
  const raw=await readRaw();
  const base=raw===undefined?(doc||blank()):(raw?migrate(JSON.parse(raw)):(doc||blank()));
  fn(base);await writeDoc(base);render();
}

function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}
function priTag(p){return p==="must"?'<span class="tag pri-must">Must-have</span>':p==="someday"?'<span class="tag pri-someday">Someday</span>':"";}

function render(){
  $("title").textContent=doc.title;$("subtitle").textContent=doc.subtitle;
  const cfg=VIEWS[view];
  $("tabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===view));
  $("newName").placeholder=cfg.placeholder;
  $("toggleDetails").style.display=cfg.hasDetails?"grid":"none";
  if(!cfg.hasDetails)$("details").classList.remove("open");
  if(cfg.hasDetails)fillCats($("newCat"),$("newCat").value);
  const data=coll();
  const counts={all:data.length,open:data.filter(i=>!i.done).length,done:data.filter(i=>i.done).length,gift:data.filter(i=>i.gift).length};
  $("filters").innerHTML=cfg.filters.map(([k,l])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}${counts[k]?` · ${counts[k]}`:""}</button>`).join("");
  $("filters").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{filter=c.dataset.f;render();});
  renderCatFilters();
  if(view==="items")renderItems();else renderSimple();
  renderSummary();
}

function renderCatFilters(){
  const box=$("catFilters");
  if(view!=="items"){box.style.display="none";box.innerHTML="";return;}
  const present=doc.categories.filter(c=>doc.items.some(i=>(i.category||"Other")===c));
  const extra=[...new Set(doc.items.map(i=>i.category||"Other"))].filter(c=>!doc.categories.includes(c));
  const cats=present.concat(extra);
  if(cats.length<2){catFilter="all";box.style.display="none";box.innerHTML="";return;}
  if(catFilter!=="all"&&!cats.includes(catFilter))catFilter="all";
  const chips=[["all","All categories"]].concat(cats.map(c=>[c,c]));
  box.style.display="flex";
  box.innerHTML=chips.map(([k,l])=>`<button class="chip" data-c="${esc(k)}" aria-pressed="${catFilter===k}">${esc(l)}</button>`).join("");
  box.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{catFilter=c.dataset.c;render();});
}

function rowButtons(){return `<div class="rowbtns">
  <button data-act="edit" aria-label="Edit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
  <button data-act="del" aria-label="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>`;}
function checkBtn(){return `<button class="check" data-act="toggle" aria-label="Mark done"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg></button>`;}
function wire(el){const id=el.dataset.id;el.querySelector('[data-act=toggle]').onclick=()=>toggle(id);el.querySelector('[data-act=edit]').onclick=()=>openEdit(id);el.querySelector('[data-act=del]').onclick=()=>del(id);}
function applyFilter(arr){if(filter==="open")return arr.filter(i=>!i.done);if(filter==="done")return arr.filter(i=>i.done);if(filter==="gift")return arr.filter(i=>i.gift);return arr;}

function renderItems(){
  let items=applyFilter(doc.items.slice());if(catFilter!=="all")items=items.filter(i=>(i.category||"Other")===catFilter);const list=$("list");
  if(!items.length){list.innerHTML=emptyHTML();return;}
  const order={must:0,nice:1,someday:2},groups={};
  items.forEach(i=>{(groups[i.category||"Other"]=groups[i.category||"Other"]||[]).push(i);});
  const cats=doc.categories.filter(c=>groups[c]).concat(Object.keys(groups).filter(c=>!doc.categories.includes(c)));
  list.innerHTML=cats.map(cat=>{
    const rows=groups[cat].sort((a,b)=>(a.done-b.done)||(order[a.priority]-order[b.priority])).map(i=>`
      <div class="item ${i.done?"done":""}" data-id="${i.id}">${checkBtn()}
        <div class="body"><div class="iname">${esc(i.name)}</div>
          <div class="meta">
            ${i.price?`<span class="tag price">R${Number(i.price).toLocaleString("en-ZA")}</span>`:""}
            ${i.gift?'<span class="tag gift">Gift</span>':""}${priTag(i.priority)}
          </div>${i.note?`<div class="note">${esc(i.note)}</div>`:""}
        </div>${rowButtons()}
      </div>`).join("");
    return `<div class="group"><h2>${esc(cat)}</h2>${rows}</div>`;
  }).join("");
  list.querySelectorAll(".item").forEach(wire);
}

function renderSimple(){
  const isQ=view==="questions";
  let arr=applyFilter(coll().slice()).sort((a,b)=>(a.done-b.done)||(b.createdAt-a.createdAt));
  const list=$("list");
  if(!arr.length){list.innerHTML=emptyHTML();return;}
  list.innerHTML=arr.map(i=>{
    const body=isQ
      ? `<div class="iname">${esc(i.name)}</div>${i.note?`<div class="answer">${esc(i.note)}</div>`:""}`
      : `<div class="iname">${esc(i.name)}</div>${i.note?`<div class="note">${esc(i.note)}</div>`:""}`;
    return `<div class="item ${i.done?"done":""}" data-id="${i.id}">${checkBtn()}<div class="body">${body}</div>${rowButtons()}</div>`;
  }).join("");
  list.querySelectorAll(".item").forEach(wire);
}

function emptyHTML(){
  const data=coll();
  const msg={items:["A clean page","Add the first thing you both need up top."],
    todos:["Nothing to do yet","Add the first task — booking classes, a massage, packing the hospital bag."],
    questions:["No questions yet","Jot down anything to ask at the next appointment so neither of you forgets."]}[view];
  if(data.length)return `<div class="empty"><h3>Nothing here</h3><p>Try another filter above.</p></div>`;
  return `<div class="empty"><h3>${msg[0]}</h3><p>${msg[1]}</p></div>`;
}

function renderSummary(){
  if(view==="items"){
    const inCat=catFilter==="all"?doc.items:doc.items.filter(i=>(i.category||"Other")===catFilter);
    const done=inCat.filter(i=>i.done).length;
    const visible=applyFilter(inCat);                       // also honour To get / Got it / Gifts
    const total=visible.reduce((s,i)=>s+(Number(i.price)||0),0);
    const lead=catFilter==="all"?"":esc(catFilter)+" · ";
    const moneyLabel={all:"Est.",open:"To get",done:"Got",gift:"Gifts"}[filter]||"Est.";
    $("count").textContent=inCat.length?`${lead}${done} of ${inCat.length} got`:"Nothing yet";
    $("rightStat").innerHTML=`${moneyLabel} <b>R${total.toLocaleString("en-ZA")}</b>`;
    $("bar").style.width=inCat.length?`${done/inCat.length*100}%`:"0";
    return;
  }
  const data=coll();const done=data.filter(i=>i.done).length;
  const label=view==="questions"?"answered":"done";
  $("count").textContent=data.length?`${done} of ${data.length} ${label}`:"Nothing yet";
  $("rightStat").textContent=data.length-done?`${data.length-done} to go`:"all clear";
  $("bar").style.width=data.length?`${done/data.length*100}%`:"0";
}
function fillCats(sel,keep){sel.innerHTML=doc.categories.map(c=>`<option ${c===keep?"selected":""}>${esc(c)}</option>`).join("");}

/* actions */
async function add(){
  const name=$("newName").value.trim();if(!name)return;
  if(view==="items"){
    const item={id:uid(),name,category:$("newCat").value||doc.categories[0],priority:$("newPri").value,
      price:$("newPrice").value?Number($("newPrice").value):0,gift:$("newGift").checked,note:"",done:false,createdAt:Date.now()};
    await mutate(d=>d.items.unshift(item));
    $("newPrice").value="";$("newGift").checked=false;$("details").classList.remove("open");
  }else{
    const item={id:uid(),name,note:"",done:false,createdAt:Date.now()};
    await mutate(d=>d[VIEWS[view].coll].unshift(item));
  }
  $("newName").value="";$("newName").focus();
}
async function toggle(id){
  const it=coll().find(x=>x.id===id);
  // resistance: ticking is instant, but unticking a done item needs a confirm
  if(it&&it.done&&!confirm(`Untick "${it.name}"? It's currently marked done.`))return;
  await mutate(d=>{const i=d[VIEWS[view].coll].find(x=>x.id===id);if(i)i.done=!i.done;});
}
async function del(id){const it=coll().find(x=>x.id===id);if(!confirm(`Remove "${it?it.name:"this"}"?`))return;await mutate(d=>{const c=VIEWS[view].coll;d[c]=d[c].filter(x=>x.id!==id);});toast("Removed");}

function openEdit(id){
  editingId=id;const i=coll().find(x=>x.id===id);if(!i)return;const cfg=VIEWS[view];
  $("editHead").textContent=cfg.editHead;$("eNameLabel").textContent=cfg.nameLabel;$("eNoteLabel").textContent=cfg.noteLabel;
  $("itemFields").style.display=cfg.showItemFields?"block":"none";
  $("eName").value=i.name;$("eNote").value=i.note||"";
  if(cfg.showItemFields){fillCats($("eCat"),i.category);$("eCat").value=i.category;$("ePri").value=i.priority;$("ePrice").value=i.price||"";$("eGift").checked=!!i.gift;}
  $("editScrim").classList.add("open");
}
async function saveEdit(){
  const cfg=VIEWS[view];
  await mutate(d=>{const i=d[cfg.coll].find(x=>x.id===editingId);if(!i)return;
    i.name=$("eName").value.trim()||i.name;i.note=$("eNote").value.trim();
    if(cfg.showItemFields){i.category=$("eCat").value;i.priority=$("ePri").value;i.price=$("ePrice").value?Number($("ePrice").value):0;i.gift=$("eGift").checked;}});
  $("editScrim").classList.remove("open");
}

/* settings */
function openSettings(){$("setTitle").value=doc.title;$("setSubtitle").value=doc.subtitle;renderCatChips();$("settingsScrim").classList.add("open");}
function renderCatChips(){$("catList").innerHTML=doc.categories.map((c,idx)=>`<span class="cattag">${esc(c)}<button data-i="${idx}" aria-label="Remove">×</button></span>`).join("");$("catList").querySelectorAll("button").forEach(b=>b.onclick=async()=>{await mutate(d=>d.categories.splice(+b.dataset.i,1));renderCatChips();});}
async function saveSettings(){await mutate(d=>{d.title=$("setTitle").value.trim()||d.title;d.subtitle=$("setSubtitle").value.trim();});}

/* wire */
$("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;filter="all";catFilter="all";render();});
$("addBtn").onclick=add;
$("newName").addEventListener("keydown",e=>{if(e.key==="Enter")add();});
$("toggleDetails").onclick=()=>$("details").classList.toggle("open");
$("settingsBtn").onclick=openSettings;
$("closeSettings").onclick=()=>$("settingsScrim").classList.remove("open");
$("settingsScrim").addEventListener("input",()=>{clearTimeout(window._ss);window._ss=setTimeout(saveSettings,500);});
$("addCat").onclick=async()=>{const v=$("newCatInput").value.trim();if(!v)return;await mutate(d=>{if(!d.categories.includes(v))d.categories.push(v);});$("newCatInput").value="";renderCatChips();};
$("saveEdit").onclick=saveEdit;
$("cancelEdit").onclick=()=>$("editScrim").classList.remove("open");
document.querySelectorAll(".scrim").forEach(s=>s.addEventListener("click",e=>{if(e.target===s)s.classList.remove("open");}));

async function poll(){const raw=await readRaw();if(raw!==undefined&&raw&&raw!==lastRaw){lastRaw=raw;doc=migrate(JSON.parse(raw));render();}}

(async function(){
  doc=blank();render();
  const raw=await readRaw();
  if(raw===undefined){toast("Can't reach the list — check the Supabase setup");}
  else if(raw){doc=migrate(JSON.parse(raw));lastRaw=raw;}
  else {await writeDoc(doc);}   // first run: create the row
  render();
  setInterval(poll,CONFIG.POLL_SECONDS*1000);
})();
</script>
</body>
</html>
